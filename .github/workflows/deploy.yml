name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Run Tests
        run: dotnet test tests/CasioDialer.Tests -c Release

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Tools and Compile TypeScript
        run: |
          # Install TS and minifiers locally in the runner for speed
          npm install typescript terser clean-css-cli
          # Use the root tsconfig which points to ./Scripts
          npx tsc -p ./src/

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build and Publish
        run: |
          # We publish first so we can minify the final output
          dotnet publish -c Release -r linux-x64 --self-contained false -o ./publish

      - name: Post-Publish Minification (JS & CSS)
        run: |
          echo "Minifying JavaScript..."
          # Protects Class/Function names for AudioWorklets and SignalR
          find ./publish/wwwroot -name "*.js" -not -name "*.min.js" -exec npx terser {} -o {} \
            --compress \
            --mangle "keep_classnames=true,keep_fnames=true" \;

          echo "Minifying CSS..."
          find ./publish/wwwroot -name "*.css" -not -name "*.min.css" -exec npx cleancss -o {} {} \;

          echo "Cleaning up stale compressed files..."
          # Removes .br and .gz so the server doesn't serve old versions
          find ./publish/wwwroot -type f \( -name "*.gz" -o -name "*.br" \) -delete

      - name: Deploy and Restart
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh_opts="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          rsync -az --delete -e "ssh $ssh_opts" ./publish/ "DataBankDialer@$SERVER_HOST:/home/DataBankDialer/prod/"
          ssh $ssh_opts "DataBankDialer@$SERVER_HOST" "sudo systemctl restart databank-dialer.service && sleep 3 && systemctl is-active --quiet databank-dialer.service"
